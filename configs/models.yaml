# Model Configurations & Cross-Validation Parameters

validation:
  n_splits: 5
  hourly_test_size_hours: 720  # 30-day blocks
  daily_test_size_days: 60     # 60-day blocks
  metrics: ["mape", "smape", "mae", "rmse", "r2", "wape"]

models:
  hourly:
    lightgbm_tuned:
      n_estimators: 400
      learning_rate: 0.04
      num_leaves: 45
      colsample_bytree: 0.8
      subsample: 0.8
      min_child_samples: 15
      random_state: 42
    xgboost:
      n_estimators: 300
      learning_rate: 0.04
      max_depth: 5
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
    ridge:
      alpha: 10.0
      random_state: 42

  daily:
    lightgbm_dedicated:
      n_estimators: 250
      learning_rate: 0.03
      num_leaves: 25
      min_child_samples: 10
      subsample: 0.85
      colsample_bytree: 0.85
      random_state: 42
    ridge:
      alpha: 5.0
      random_state: 42
